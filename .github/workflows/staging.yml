name: Staging Build & Test

on:
  push:
    branches:
      - staging

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc[gs]  # ajoute le support du remote Dagshub (S3-compatible)

      - name: Configure DVC remote (si pas déjà fait)
        run: dvc remote default origin
        continue-on-error: true  # Évite l'échec si déjà configuré

      - name: Pull dataset from DVC remote
        run: dvc pull

      - name: Reproduce pipeline
        run: dvc repro

      - name: Run unit and integration tests
        run: pytest
