name: Staging Build & Test

on:
  push:
    branches:
      - staging

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      backend:
        build:
          context: ./backend
        ports:
          - 8000:8000
      frontend:
        build:
          context: ./frontend
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest requests

      - name: Run tests
        run: pytest tests/